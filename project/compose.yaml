services:
  db:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - dbdata:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      retries: 10

  web:
    build: ..
    ports:
      - "8080:8080"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata: